<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f7fb;
            margin: 40px;
            color: #333;
        }

        h1 {
            color: #1565c0;
            text-align: center;
        }

        h2 {
            color: #1565c0;
        }

        nav {
            background-color: #1565c0;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            background-color: #1565c0;
            color: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        input, select {
            width: 300px;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #bbb;
            border-radius: 5px;
        }

        button {
            background-color: #1565c0;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0d47a1;
        }

        fieldset {
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 15px;
        }

        legend {
            font-weight: bold;
            color: #1565c0;
        }
    </style>

</head>

<body>

    <h1 id="inicio">Minha Loja</h1>

    <nav>
        <ul>
            <li><a href="#inicio">Início</a></li>
            <li><a href="#produtos">Produtos</a></li>
            <li><a href="#cadastro">Cadastro</a></li>
        </ul>
    </nav>

    <section id="produtos">

        <h2>Produtos</h2>

        <ul>
            <li>Eletrônicos</li>
            <li>Roupas</li>
            <li>Acessórios</li>
        </ul>

        <table>

            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Preço</th>
                    <th>Categoria</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Notebook</td>
                    <td>R$ 3.500,00</td>
                    <td>Eletrônicos</td>
                </tr>

                <tr>
                    <td>Camiseta</td>
                    <td>R$ 79,90</td>
                    <td>Roupas</td>
                </tr>

                <tr>
                    <td>Relógio</td>
                    <td>R$ 199,90</td>
                    <td>Acessórios</td>
                </tr>
            </tbody>

        </table>

    </section>

    <section id="cadastro">

        <h2>Cadastro</h2>

        <form>

            <fieldset>
                <legend>Dados pessoais</legend>

                <label for="nome">Nome:</label><br>
                <input type="text" id="nome" required><br>

                <label for="email">E-mail:</label><br>
                <input type="email" id="email" required><br>
            </fieldset>

            <fieldset>
                <legend>Acesso</legend>

                <label for="senha">Senha:</label><br>
                <input type="password" id="senha" minlength="8"><br>
            </fieldset>

            <label for="categoria">Categoria favorita:</label><br>

            <select id="categoria">
                <option>Eletrônicos</option>
                <option>Roupas</option>
                <option>Acessórios</option>
            </select>

            <br><br>

            <button type="submit">Enviar</button>

        </form>

    </section>

   

</body>
</html>
