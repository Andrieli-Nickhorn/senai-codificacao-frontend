<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria - N. Queiroz Paraíso Equoterapia</title>
</head>
<body>

    <!-- INÍCIO: cabeçalho -->
    <header>
        <h1>N. Queiroz Paraíso Equoterapia</h1>

        <nav aria-label="Menu principal">
            <a href="index.html">Início</a> |
            <a href="servicos.html">Serviços</a> |
            <a href="galeria.html">Galeria</a> |
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <!-- INÍCIO: conteúdo principal -->
    <main>

        <section id="galeria">
            <h2>Galeria</h2>

            <img
                src="img/galeria1.jpg"
                alt="Participante realizando atividade de equoterapia"
                width="250"
                height="180"
                loading="lazy">

            <img
                src="img/galeria2.jpg"
                alt="Cavalo utilizado nas atividades da equoterapia"
                width="250"
                height="180"
                loading="lazy">

            <img
                src="img/galeria3.jpg"
                alt="Participante interagindo com um cavalo"
                width="250"
                height="180"
                loading="lazy">

            <img
                src="img/galeria4.jpg"
                alt="Sessão de equoterapia realizada ao ar livre"
                width="250"
                height="180"
                loading="lazy">
        </section>

        <!-- INÍCIO: vídeo -->
        <section id="video">
            <h2>Vídeo</h2>

            <video
                controls
                preload="metadata"
                width="500">

                <source
                    src="video.mp4"
                    type="video/mp4">

                Seu navegador não suporta a reprodução de vídeo.
            </video>
        </section>

        <!-- INÍCIO: áudio -->
        <section id="audio">
            <h2>Áudio</h2>

            <audio controls>
                <source
                    src="audio.mp3"
                    type="audio/mpeg">

                Seu navegador não suporta a reprodução de áudio.
            </audio>
        </section>

        <!-- INÍCIO: YouTube -->
        <section id="youtube">
            <h2>Conheça a Equoterapia</h2>

            <iframe
                width="560"
                height="315"
                src="https://www.youtube.com/embed/2fRr8aB7G9s"
                title="Vídeo sobre equoterapia"
                loading="lazy"
                allowfullscreen>
            </iframe>
        </section>

    </main>

    <!-- INÍCIO: rodapé -->
    <footer>
        <p>Alexa Rembowski e Andrieli Nickhorn</p>
    </footer>

</body>
</html>
