<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Loja</title>
</head>
<body>

    <h1>Mini Loja</h1>

    <main>

        <section id="produtos">
            <h2>Produtos</h2>

            <article>
                <h3>Smartphone</h3>

                <img src="assets/iphone.jpg"
                     alt="Smartphone laranja com três câmeras traseiras e tela preta com linhas abstratas em tons de laranja."
                     width="250"
                     height="250"
                     loading="lazy">
            </article>

            <article>
                <h3>Camiseta</h3>

                <figure>
                    <img src="assets/camisa.jpg"
                         alt="Camiseta branca de manga curta e gola redonda sobre fundo branco."
                         width="250"
                         height="250"
                         loading="lazy">

                    <figcaption>Camiseta branca - R$ 59,90</figcaption>
                </figure>
            </article>
        </section>

        <!-- Quando o caminho ficou errado, apareceu o ícone de imagem quebrada e a foto não carregou porque o arquivo não foi encontrado. -->

        <section>
            <h2>Vídeo do produto</h2>

            <video controls width="400" preload="metadata">
                <source src="assets/video.mp4" type="video/mp4">
                Seu navegador não suporta vídeo.
            </video>
        </section>

        <section>
            <h2>Conteúdo externo</h2>

            <iframe
                src="https://www.youtube.com/embed/a4cA0ET9DRY"
                width="400"
                height="225"
                title="Vídeo externo sobre tecnologia"
                loading="lazy"
                allowfullscreen>
            </iframe>
        </section>

        <!-- Código com erro:
        <img src=img/camisa.jpg alt="produto"></img>
        -->

        <!-- Código corrigido: -->
        <img src="assets/camisa.jpg"
             alt="Camiseta branca de manga curta e gola redonda sobre fundo branco.">

        <!-- Código original:
        <video width="400">
            <source src="img/video.mp4">
        </video>
        -->

        <!-- Código corrigido: -->
        <video controls width="400">
            <source src="assets/video.mp4" type="video/mp4">
            Seu navegador não suporta vídeo.
        </video>

    </main>

    <footer>
        <p>Desenvolvido por: Alexa Rembowski e Andrieli Nickhorn</p>
    </footer>

</body>
</html>
